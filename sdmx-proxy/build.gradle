plugins {
    id 'java'

    id 'org.springframework.boot' version "${spring_boot_version}"
    id 'io.spring.dependency-management' version "${spring_dependency_management_version}"
}

description = 'SDMX API Proxy'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    // Exclude default Logback to use Log4j2
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'ch.qos.logback'
    }
}


// allprojects block is now in root build.gradle

repositories {
    mavenCentral()
    maven {
        name = "BIS GitHub Packages"
        url = uri("https://maven.pkg.github.com/bis-med-it/sdmx-core")
        credentials {
            username = repoUser
            password = repoPassword
        }
    }
}

ext['jackson-bom.version'] = jackson_bom_version
ext['tomcat.version'] = tomcat_version
ext['log4j2.version'] = log4j2_version
ext['commons-lang3.version'] = commons_lang3_version
ext['netty.version'] = netty_version

dependencies {
    implementation project(':sdmx-proxy-config')

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation("org.springframework:spring-aspects")
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito for unit testing
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'

    implementation("com.epam.jsdmx:sdmx30-infomodel:${sdmx30_infomodel_version}")

    //EXTRENAL QH DEPENDENCIES.
    [
            "sdmx30-serializer",
            "sdmx-json10",
            "sdmx-json20",
            "sdmx-ml21",
            "sdmx-ml30"
    ].each { module ->
        implementation("com.epam.jsdmx:${module}:${sdmx30_internal_version}") {
            exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
            exclude group: 'jakarta.xml.bind', module: 'jaxb-core'
            exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
        }
    }

    [
            "fusion-api",
            "fusion-api-sdmx",
            "fusion-core-data",
            "fusion-core-sdmx",
            "fusion-sdmx-csv",
            "fusion-sdmx-im",
            "fusion-sdmx-json",
            "fusion-sdmx-ml",
            "fusion-utils",
            "fusion-utils-json",
            "fusion-utils-sdmx",
    ].each { module ->
        implementation("io.sdmx:${module}:${sdmx_core_version}")
    }

    //------SDMX CORE dependencies start----
    implementation("org.codehaus.jettison:jettison:${jettison_version}")
    implementation("com.fasterxml.woodstox:woodstox-core:${woodstox_core_version}")
    implementation("it.unimi.dsi:fastutil-core:${fastutil_core_version}")
    implementation("com.esotericsoftware:kryo:${kryo_version}")
    //------SDMX CORE dependencies end------

    implementation("org.apache.xmlbeans:xmlbeans:${xmlbeans_version}")
    implementation("org.threeten:threetenbp:${threetenbp_version}")
    implementation("org.json:json:${json_version}")
    implementation("commons-io:commons-io:${commons_io_version}")
    implementation("com.opencsv:opencsv:${opencsv_version}")

    compileOnly("org.projectlombok:lombok")
    annotationProcessor("org.projectlombok:lombok")
    testCompileOnly("org.projectlombok:lombok")
    testAnnotationProcessor("org.projectlombok:lombok")

    implementation("org.slf4j:slf4j-api:${slf4j_version}")

    implementation("io.github.openfeign:feign-core:${feign_version}")
    implementation("io.github.openfeign:feign-jackson:${feign_version}")
    implementation("io.github.openfeign:feign-okhttp:${feign_version}")
    implementation("io.github.openfeign:feign-slf4j:${feign_version}")
    implementation("com.squareup.okhttp3:okhttp:${okhttp_version}")

    // Resilience4j for circuit breaker, retry, and rate limiting
    implementation("io.github.resilience4j:resilience4j-core:${resilience4j_version}")
    implementation("io.github.resilience4j:resilience4j-retry:${resilience4j_version}")
    implementation("io.github.resilience4j:resilience4j-circuitbreaker:${resilience4j_version}")
    implementation("io.github.resilience4j:resilience4j-ratelimiter:${resilience4j_version}")
    implementation("io.github.resilience4j:resilience4j-feign:${resilience4j_version}")

    implementation("org.apache.commons:commons-lang3:${commons_lang3_version}")
    implementation("org.apache.commons:commons-collections4:${commons_collections4_version}")

    // Caching dependencies
    implementation("com.github.ben-manes.caffeine:caffeine:${caffeine_version}")
    implementation("org.springframework.boot:spring-boot-starter-data-redis")

    // Cloud provider Redis authentication
    implementation("com.azure:azure-identity:${azure_identity_version}")
    implementation("com.amazonaws:aws-java-sdk-core:${aws_sdk_core_version}")
    implementation("com.google.cloud:google-cloud-iamcredentials:${gcp_iamcredentials_version}")

    // OpenTelemetry dependencies
    implementation platform("io.grpc:grpc-bom:${grpc_bom_version}")
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${opentelemetry_instrumentation_version}")
    implementation "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter:${opentelemetry_instrumentation_version}"
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation "io.opentelemetry.instrumentation:opentelemetry-log4j-appender-2.17:${opentelemetry_instrumentation_version}-alpha"
    // Required for automatic trace_id/span_id injection into Log4j2 MDC
    implementation "io.opentelemetry.instrumentation:opentelemetry-log4j-context-data-2.17-autoconfigure:${opentelemetry_instrumentation_version}-alpha"

    // OpenAPI/Swagger documentation
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdoc_openapi_version}"
}

tasks.named('test') {
    maxHeapSize = '2g'
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Created-By': vendor,
                // Note: if a child project has custom "archivesBaseName" then this child project have to override value for this property
                'Implementation-Title': archiveBaseName.get(),
                'Implementation-Vendor': vendor,
                'Implementation-Version': findProperty("version")
    }
}


compileJava {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

processResources {
    from project(':sdmx-proxy-config').file('src/main/resources/sdmx_registries_config.json')
}

clean.doLast {
    file('out').deleteDir()
}

test {
    ignoreFailures Boolean.getBoolean("test.ignoreFailures")
    reports.junitXml.required = true

    doLast {
        copy {
            from reports.junitXml.getOutputLocation() include { "*.xml" }
            into file("$rootDir/build/test-results/test")
        }
    }
}

// Configure bootJar to merge Log4j2Plugins.dat files
tasks.named('bootJar') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

build.dependsOn bootJar

defaultTasks 'clean', 'build'
