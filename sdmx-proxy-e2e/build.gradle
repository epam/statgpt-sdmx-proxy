plugins {
    id 'java'
}

group = 'com.epam'
version = '0.0.1-SNAPSHOT'
description = 'SDMX Proxy E2E Tests'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    mavenDeltixProxy('external-quanthub')
}

dependencies {
    testImplementation project(':sdmx-proxy-config')

    // Testcontainers for Docker container orchestration
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'

    // RestAssured for HTTP client (black-box testing)
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'io.rest-assured:json-path:5.4.0'
    testImplementation 'io.rest-assured:xml-path:5.4.0'

    // Assertions
    testImplementation 'org.assertj:assertj-core:3.25.1'
    testImplementation 'net.javacrumbs.json-unit:json-unit-assertj:3.2.2'

    // JSON parsing
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.17.0'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Lombok (if needed for test utilities)
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'

    // Logging (for test output)
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    // Test cases
    testImplementation 'io.github.pavelicii:allpairs4j:1.0.1'

}

tasks.named('test') {
    maxHeapSize = '2g'
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

test {
    ignoreFailures Boolean.getBoolean("test.ignoreFailures")
    reports.junitXml.required = true

    // Container log reports directory
    def e2eLogsDir = "${buildDir}/reports/e2e-logs"
    systemProperty 'e2e.logs.dir', e2eLogsDir

    doLast {
        copy {
            from reports.junitXml.getOutputLocation()
            include "*.xml"
            into file("$rootDir/build/test-results/e2e")
        }
        copy {
            from e2eLogsDir
            into file("$rootDir/build/reports/e2e-logs")
        }
    }
}
