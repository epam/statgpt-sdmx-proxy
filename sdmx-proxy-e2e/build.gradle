plugins {
    id 'java'
}

description = 'SDMX Proxy E2E Tests'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    mavenProxyRepo('maven')
}

dependencies {
    testImplementation project(':sdmx-proxy-config')

    // Testcontainers for Docker container orchestration
    testImplementation "org.testcontainers:testcontainers:${testcontainers_version}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainers_version}"

    // RestAssured for HTTP client (black-box testing)
    testImplementation "io.rest-assured:rest-assured:${rest_assured_version}"
    testImplementation "io.rest-assured:json-path:${rest_assured_version}"
    testImplementation "io.rest-assured:xml-path:${rest_assured_version}"

    // Assertions
    testImplementation "org.assertj:assertj-core:${assertj_core_version}"
    testImplementation "net.javacrumbs.json-unit:json-unit-assertj:${json_unit_version}"

    // JSON parsing
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:${jackson_version}"

    // JUnit 5
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_jupiter_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Lombok (if needed for test utilities)
    testCompileOnly "org.projectlombok:lombok:${lombok_version}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"

    // Logging (for test output)
    testImplementation "org.slf4j:slf4j-api:${slf4j_version}"
    testRuntimeOnly "org.slf4j:slf4j-simple:${slf4j_version}"

    // Test cases
    testImplementation "io.github.pavelicii:allpairs4j:${allpairs4j_version}"

}

// Disable default test task so e2e tests don't run with `./gradlew test`
tasks.named('test') {
    enabled = false
}

// Dedicated task for running e2e tests
tasks.register('e2eTest', Test) {
    description = 'Runs E2E tests against a live proxy in Docker'
    group = 'verification'

    maxHeapSize = '2g'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    ignoreFailures = Boolean.getBoolean("test.ignoreFailures")
    reports.junitXml.required = true

    // Container log reports directory
    def e2eLogsDir = "${buildDir}/reports/e2e-logs"
    systemProperty 'e2e.logs.dir', e2eLogsDir

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    doLast {
        copy {
            from reports.junitXml.getOutputLocation()
            include "*.xml"
            into file("$rootDir/build/test-results/e2e")
        }
        copy {
            from e2eLogsDir
            into file("$rootDir/build/reports/e2e-logs")
        }
    }
}

// Disable check so this module is skipped in CI ./gradlew check
check.enabled = false