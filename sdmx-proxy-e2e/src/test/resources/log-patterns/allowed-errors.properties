# Allowed error patterns for E2E tests logs gate
# Format: allowed.pattern.N=regex pattern
# Add patterns here when tests fail due to known benign errors
# Document each pattern: what it means, why it's allowed, when it was added

# E2E containers are started with a filesystem config source but no file on disk --
# tests POST the configuration via /config at @BeforeAll. The startup-time log is a
# benign WARN/ERROR from FileSystemConfigExtractorProxy and from the limit-emulation
# startup validator which skips validation when no config is loadable.
allowed.pattern.1=.*Configuration file does not exist: /opt/epam/sdmx-proxy/sdmx_registries_config\\.json.*
allowed.pattern.2=.*LimitEmulationStartupValidator: cannot load proxy configuration at boot.*
