spring:
  application:
    name: sdmx-proxy-config-server

server:
  port: 8060

sdmxproxy:
  configserver:
    auth:
      api-key: ${CONFIG_SERVER_API_KEY:}
    source:
      # One of: DIAL_STORAGE, FILESYSTEM
      type: ${CONFIG_SERVER_SOURCE_TYPE:FILESYSTEM}
      # Path to the config file (filesystem path for FILESYSTEM, object path for DIAL_STORAGE)
      config-path: ${CONFIG_SERVER_SOURCE_CONFIG_PATH:config/sdmx_registries_config.json}
      # When true, overwrite stored configuration from the bundled classpath default on startup (DIAL_STORAGE only).
      force-seed: ${CONFIG_SERVER_FORCE_SEED:false}
    dial-storage:
      base-url: ${DIAL_STORAGE_BASE_URL:http://localhost:9000}
      api-key: ${DIAL_STORAGE_API_KEY:}
      connect-timeout-ms: 10000
      read-timeout-ms: 15000
      write-timeout-ms: 30000

# OpenTelemetry configuration
otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  service:
    name: statgpt-sdmx-proxy-config-server
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      traces:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
        protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      metrics:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
        protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      logs:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
        protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:otlp}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:otlp}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
