// Root build.gradle - shared configuration for all subprojects

version = "0.0.0"

var mavenProxy = findProperty('MAVEN_PROXY_CONFIG') ?: System.getenv('MAVEN_PROXY_CONFIG') ?: "MavenCentral"

allprojects {
    version = rootProject.version
    group = 'com.epam'

    apply from: "$rootDir/gradle/Common.gradle"
    apply from: "$rootDir/gradle/${mavenProxy}.gradle"
}

// Apply Checkstyle to application modules (not E2E)
configure(subprojects.findAll { it.name != 'sdmx-proxy-e2e' }) {
    apply plugin: 'checkstyle'

    checkstyle {
        configFile = rootProject.file('checkstyle/checkstyle.xml')
        ignoreFailures = true
    }
}

// Force vulnerable transitive dependencies to patched versions.
// Covers CVEs flagged by the Dependency Review workflow that are not
// managed by the Spring Boot BOM (those are pinned via ext[...] in each module).
subprojects {
    configurations.all {
        resolutionStrategy {
            force "commons-beanutils:commons-beanutils:${commons_beanutils_version}"
            force "org.codehaus.plexus:plexus-utils:${plexus_utils_version}"
            force "org.apache.commons:commons-compress:${commons_compress_version}"
            force "org.apache.commons:commons-lang3:${commons_lang3_version}"
            force "com.jayway.jsonpath:json-path:${json_path_version}"
            force "net.minidev:json-smart:${json_smart_version}"
        }
    }
}

ext {
    vendor = 'EPAM Systems, Inc.'
    archivesBaseName = 'epam' + project.path.replaceAll(':', '-')
}

defaultTasks 'clean', 'build'
