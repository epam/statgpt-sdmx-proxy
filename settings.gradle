// Keep this distinct from the included :sdmx-proxy project. ORT identifies a Gradle
// project as group:name:version, and allprojects applies the same group and version
// to the root, so a shared name makes the two projects collide.
rootProject.name = 'statgpt-sdmx-proxy'

include 'sdmx-proxy'
include 'sdmx-proxy-config'
include 'sdmx-proxy-e2e'
include 'sdmx-proxy-config-server'

// Allow repositories to be defined in build.gradle files
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
}
