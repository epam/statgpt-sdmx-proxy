plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'sdmx-proxy'

include 'sdmx-proxy'
include 'sdmx-proxy-config'
include 'sdmx-proxy-e2e'
include 'sdmx-proxy-config-server'

// Allow repositories to be defined in build.gradle files
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
}
