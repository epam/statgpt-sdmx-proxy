name: test-core
description: Run statgpt-sdmx-proxy E2E tests from this repo against the review DIAL Core URL
inputs:
  environment-url:
    description: Application URL of the environment, e.g. `https://core-statgpt-sdmx-proxy-pr-1.example.com`
    required: true
  test-repository:
    description: GitHub repository with E2E test sources
    default: epam/statgpt-sdmx-proxy
  test-branch:
    description: Git branch name of the E2E test repository to use
    default: development
  java-distribution:
    description: Java distribution
    default: corretto
  java-version:
    description: Java version
    default: "25"
  gradle-task:
    description: Gradle task that runs the E2E suite
    default: :sdmx-proxy-e2e:e2eTest
  test-filter:
    description: Gradle --tests filter for the E2E suite
    default: "*"
  report-prefix:
    description: Test report name prefix
    default: ${{ github.run_id }}
  working-directory:
    description: Working directory to run tests in
    default: tests

runs:
  using: composite
  steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: ${{ inputs.test-repository }}
        ref: ${{ inputs.test-branch }}
        path: ${{ inputs.working-directory }}
        lfs: false
        persist-credentials: false
    - uses: epam/ai-dial-ci/actions/java_prepare@4.4.0
      with:
        java-version: ${{ inputs.java-version }}
        java-distribution: ${{ inputs.java-distribution }}
    - name: Run E2E tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        E2E_HOST: ${{ inputs.environment-url }}
        E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
      run: |
        echo "URL to run e2e tests against: ${E2E_HOST}"
        ./gradlew ${{ inputs.gradle-task }} --tests "${{ inputs.test-filter }}"
    - name: Upload JUnit reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.report-prefix }}-e2e
        path: ${{ inputs.working-directory }}/build/test-results/e2e/
        retention-days: 30
